# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Insecure Go Project (secDevLabs, by Globo.com) as an Isoloom spec: a Go API whose MongoDB
# credentials are hardcoded in its source, an Identification and Authentication Failure.
# Vendored unchanged in build/api/app/ (the app folder owasp-top10-2021-apps/a7/insecure-go-project
# of secDevLabs), built by an overlay of upstream's Dockerfile, and its MongoDB machine,
# published as upstream does. `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-insecure-go-project

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.106.0/24, internet: false}

machines:
  mongodb:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {data: /data/db}
    ports:
      mongodb:
        port: 27017
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/mongodb

  api:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [mongodb]
    ports:
      api:
        port: 10002
        protocol: http
        publish: true
    app:
      build: build/api
checks:
  - name: the API answers (it logged in to MongoDB at start)
    http: http://api:10002/healthcheck
    wait: 180
  - name: MongoDB is reachable from the network
    tcp: mongodb:27017

message: |
  Insecure Go Project answers at {{ machines.api.ports.api.url }}healthcheck
  and its MongoDB at localhost:{{ machines.mongodb.ports.mongodb.published }}. The source is in
  build/api/app/: how does the API log in to its database?
